    if (fuelKey !== 'all'){
      var f = fuels[fuelKey];
      if (!f || f.status === 'unknown' || f.fresh_level === 'gone') return 'unknown';

    }
    var worst = -1, any = false;
    for (var k in fuels){

      if (x.status !== 'unknown' && x.fresh_level !== 'gone'){

        var sev = x.status === 'low' ? 0 : SEVERITY[x.status];

    try { q = JSON.parse(localStorage.getItem(OFFLINE_KEY) || '[]'); }
    catch(e){ done(); return Promise.resolve(); }
    if (!Array.isArray(q) || !q.length) { done(); return Promise.resolve(); }
    var rest = [];
    var chain = Promise.resolve();
    q.forEach(function(item){
      chain = chain.then(function(){
        return fetch(item.url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(item.body),
        }).then(function(r){ return r.json(); })
          .then(function(j){ if (!j || !j.ok) rest.push(item); })
          .catch(function(){ rest.push(item); });
      });
    });
    return chain.then(function(){
      try { localStorage.setItem(OFFLINE_KEY, JSON.stringify(rest)); } catch(e){}
      var sent = q.length - rest.length;
      if (sent > 0) toast('Синхронизировано: ' + sent);
      done();
    }).catch(function(){ done(); });
  }

  var _audioCtx = null;
  function playTone(freqStart, freqEnd, durMs){
    try { if (localStorage.getItem('azs_sound_on') === '0') return; } catch(e){}
    try {
      if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (_audioCtx.state === 'suspended') _audioCtx.resume();
      var osc = _audioCtx.createOscillator();
      var gain = _audioCtx.createGain();
      osc.type = 'triangle';
      var now = _audioCtx.currentTime;
      var dur = durMs / 1000;
      osc.frequency.setValueAtTime(freqStart, now);
      osc.frequency.exponentialRampToValueAtTime(freqEnd, now + dur);
      var osc2 = _audioCtx.createOscillator();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(freqStart * 2, now);
      osc2.frequency.exponentialRampToValueAtTime(freqEnd * 2, now + dur);
      var gain2 = _audioCtx.createGain();
      gain2.gain.setValueAtTime(0.0001, now);
      gain2.gain.exponentialRampToValueAtTime(0.25, now + 0.02);
      gain2.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc2.connect(gain2); gain2.connect(_audioCtx.destination);
      osc2.start(now); osc2.stop(now + dur + 0.02);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.5, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain); gain.connect(_audioCtx.destination);
      osc.start(now); osc.stop(now + dur + 0.02);
    } catch(e){}
  }

  function haversine(lat1, lon1, lat2, lon2){
    var R = 6371000;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  function findNearestStation(lat, lng){
    var best = null, bestD = Infinity;
    stationsData.forEach(function(s){
      var d = haversine(lat, lng, s.lat, s.lng);
      if (d < bestD){ bestD = d; best = s; }
    });
    return { station: best, distance: bestD };
  }

  function freshnessInfo(ts){
    if (!ts) return { color: '#6B6F76', label: 'нет данных' };
    var diffMin = (Date.now() / 1000 - ts) / 60;
    if (diffMin < 1) return { color: '#4CAF7D', label: 'только что' };
    if (diffMin < 60) return { color: '#8BC34A', label: Math.round(diffMin) + ' мин назад' };
    if (diffMin < 1440) return { color: '#FFC107', label: Math.round(diffMin / 60) + ' ч назад' };
    return { color: '#8A8F98', label: Math.round(diffMin / 1440) + ' дн назад' };
  }

  // =====================================================
  // VOICE PARSER
  // =====================================================
  function parseVoiceText(raw){
    var text = String(raw || '').toLowerCase()
      .replace(/ё/g, 'е')
      .replace(/[!?;:]/g, ',')
      .trim();
    var chunks = text.split(/[,.]/).map(function(c){ return c.trim(); }).filter(function(c){ return c.length > 0; });

    var fuelAliases = {
      f92: ['девяносто второй', 'девяносто два', 'девяносто 2', '92', 'девяносто второе', '92-й', '92й'],
      f95: ['девяносто пятый', 'девяносто пять', 'девяносто 5', '95', 'девяносто пятое', '95-й', '95й'],
      f98: ['девяносто восьмой', 'девяносто восемь', 'девяносто 8', '98', 'девяносто восьмое', '98-й', '98й'],
      dt:  ['дизель', 'дизеля', 'дизелю', 'дизельное', 'дизельное топливо', 'дт', 'солярка', 'солярку', 'солярки']
    };
    var okWords = ['есть', 'имеется', 'залил', 'заправился', 'полный', 'полная', 'наливаю', 'в наличии', 'заправил', 'имеются'];
    var noneWords = ['нет', 'отсутствует', 'закончился', 'закончилось', 'пусто', 'пустой', 'отсутствуют', 'кончился'];

    function findFuel(chunk){
      for (var key in fuelAliases){
        for (var i = 0; i < fuelAliases[key].length; i++){
          if (chunk.indexOf(fuelAliases[key][i]) !== -1) return key;
        }
      }
      return null;
    }
    function findStatus(chunk){
      for (var i = 0; i < okWords.length; i++){
        if (chunk.indexOf(okWords[i]) !== -1) return 'ok';
      }
      for (var i = 0; i < noneWords.length; i++){
        if (chunk.indexOf(noneWords[i]) !== -1) return 'none';
      }
      return null;
    }

    var result = { fuels: {}, flags: {} };

    for (var ci = 0; ci < chunks.length; ci++){
      var chunk = chunks[ci];

      if (/очеред|пробк|люди стоят|машины стоят|стоят в очередь/.test(chunk)){
        result.flags.flag_queue = true;
        continue;
      }
      if (/лимит|ограничен|по литраж|по литрам|не больше|по 10 литров|по 20 литров/.test(chunk)){
        result.flags.flag_limit = true;
        continue;
      }

      if (chunk.indexOf('кроме') !== -1){
        var afterKrome = chunk.split('кроме').pop();
        var excl = findFuel(afterKrome);
        var globalNone = /ничего нет|все нет|всё нет|нет ничего/.test(chunk);
        var globalOk = /все есть|всё есть|есть все|есть всё/.test(chunk);
        if (excl && (globalNone || globalOk)){
          for (var key in fuelAliases){
            if (key === excl){
              result.fuels[key] = globalNone ? 'ok' : 'none';
            } else {
              result.fuels[key] = globalNone ? 'none' : 'ok';
            }
          }
          continue;
        }
      }

      var fuel = findFuel(chunk);
      var status = findStatus(chunk);
      if (fuel && status){
        result.fuels[fuel] = status;
      }
    }

    return result;
  }

  function applyVoiceResult(parsed){
    if (!sheetStation) return;
    var applied = 0;
    for (var fuelKey in parsed.fuels){
      if (parsed.fuels.hasOwnProperty(fuelKey)){
        sheetPending[fuelKey] = parsed.fuels[fuelKey];
        applied++;
      }
    }
    for (var flagKey in parsed.flags){
      if (parsed.flags.hasOwnProperty(flagKey)){
        sheetPendingFlags[flagKey] = parsed.flags[flagKey];
        applied++;
      }
    }
    if (applied === 0){
      toast('Не разобрал. Скажите: "девяносто пятый есть, дизель нет"');
      return false;
    }
    renderSheet();
    var summary = [];
    var fuelOrder = ['f92','f95','f98','dt'];
    for (var i = 0; i < fuelOrder.length; i++){
      var k = fuelOrder[i];
      if (sheetPending[k]){
        summary.push(FUEL_SHORT[k] + ': ' + (sheetPending[k] === 'ok' ? 'есть' : 'нет'));
      }
    }
    if (sheetPendingFlags.flag_queue) summary.push('очередь');
    if (sheetPendingFlags.flag_limit) summary.push('лимит');
    showVoiceBanner(summary.join(', '), 'Применяю…');
    setTimeout(function(){
      flushBatch(false).then(function(){
        hideVoiceBanner();
        closeSheet();
      });
    }, 600);
    return true;
  }

  function startVoiceRecognition(){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR){
      toast('Голосовой ввод не поддерживается в этом браузере');
      return;
    }
    if (!sheetStation){
      toast('Сначала откройте станцию');
      return;
    }
    if (voiceListening){
      try { voiceRecognition.stop(); } catch(e){}
      return;
    }

    voiceRecognition = new SR();
    voiceRecognition.lang = 'ru-RU';
    voiceRecognition.continuous = false;
    voiceRecognition.interimResults = true;
    voiceRecognition.maxAlternatives = 1;

    voiceRecognition.onstart = function(){
      voiceListening = true;
      var btn = document.getElementById('sh-mic');
      if (btn) btn.classList.add('listening');
      showVoiceBanner('Говорите…', 'Например: "девяносто пятый есть, девяносто восьмого нет"');
    };

    voiceRecognition.onresult = function(event){
      var interim = '';
      var finalText = '';
      for (var i = event.resultIndex; i < event.results.length; i++){
        var r = event.results[i];
        if (r.isFinal) finalText += r[0].transcript;
        else interim += r[0].transcript;
      }
      if (finalText){
        showVoiceBanner(finalText, 'Разбираю…');
        var parsed = parseVoiceText(finalText);
        applyVoiceResult(parsed);
      } else if (interim) {
        showVoiceBanner(interim, 'Слушаю…');
      }
    };

    voiceRecognition.onerror = function(event){
      voiceListening = false;
      var btn = document.getElementById('sh-mic');
      if (btn) btn.classList.remove('listening');
      hideVoiceBanner();
      if (event.error === 'not-allowed' || event.error === 'service-not-allowed'){
        toast('Разрешите доступ к микрофону');
      } else if (event.error === 'no-speech'){
        toast('Не услышал. Попробуйте ещё раз');
      } else {
        toast('Ошибка распознавания: ' + event.error);
      }
    };

    voiceRecognition.onend = function(){
      voiceListening = false;
      var btn = document.getElementById('sh-mic');
      if (btn) btn.classList.remove('listening');
    };

    try { voiceRecognition.start(); }
    catch(e){ toast('Не удалось запустить микрофон'); }
  }

  function queueChange(fuelKey, status){
    if (status === 'ok') soundFuelYes(); else soundFuelNo();
    sheetPending[fuelKey] = status;
    if (sheetStation && sheetStation.fuels && sheetStation.fuels[fuelKey]){
      sheetStation.fuels[fuelKey].status = status;
      sheetStation.fuels[fuelKey].stale = false;
      sheetStation.fuels[fuelKey].ts = Math.floor(Date.now() / 1000);
    }
    renderSheet();
    scheduleCloseTimer();
    scheduleBatchSave();
  }

  function queueFlag(flagKey, on){
    sheetPendingFlags[flagKey] = on;
    if (sheetStation && sheetStation.flags && sheetStation.flags[flagKey]){
      sheetStation.flags[flagKey].on = on;
      sheetStation.flags[flagKey].ts = Math.floor(Date.now() / 1000);
    }
    renderSheet();
    scheduleCloseTimer();
    scheduleBatchSave();
  }

  function scheduleBatchSave(){
    if (batchSaveTimer) clearTimeout(batchSaveTimer);
    batchSaveTimer = setTimeout(function(){ flushBatch(false); }, BATCH_SAVE_DELAY_MS);
  }

  function flushBatch(closing){
    if (batchSaveTimer) { clearTimeout(batchSaveTimer); batchSaveTimer = null; }
    if (!sheetStation) return Promise.resolve();
    var stationId = sheetStation.id;
    var fuelsCopy = Object.assign({}, sheetPending);
    var flagsCopy = Object.assign({}, sheetPendingFlags);
    if (!Object.keys(fuelsCopy).length && !Object.keys(flagsCopy).length) return Promise.resolve();
    sheetPending = {};
    sheetPendingFlags = {};

    showSaving(true);
    return sendOrQueue('/api/report-batch', {
      station_id: stationId, user_id: userId, username: effectiveUsername || '',
      fuels: fuelsCopy, flags: flagsCopy
    }).then(function(j){
      if (j && j.ok){
        if (j.points_earned) toast('+' + j.points_earned + ' баллов');
        updateMarkerFor(stationId);
      } else {
        toast('Не сохранилось: ' + (j.error || ''));
      }
    }).catch(function(e){
      console.error(e);
      toast('Ошибка сети');
    }).then(function(){
      showSaving(false);
      if (closing && sheetStation && sheetStation.id === stationId) sheetStation = null;
    });
  }

  document.getElementById('sheet').addEventListener('click', function(e){
    var t = e.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act');
    if (act === 'voice'){ startVoiceRecognition(); return; }
    if (act === 'report'){
      var fuelKey = t.getAttribute('data-fuel');
      var status = t.getAttribute('data-status');
      // ВСЕГДА обновляем статус (не переключаем)
      queueChange(fuelKey, status);
      return;
    }
    if (act === 'flag'){
      var fk = t.getAttribute('data-flag');
      var wasOn = (fk in sheetPendingFlags) ? sheetPendingFlags[fk] : (sheetStation.flags[fk] && sheetStation.flags[fk].on);
      queueFlag(fk, !wasOn);
      return;
    }
    if (act === 'close-sheet'){ closeSheet(); return; }
    if (act === 'route'){ if (sheetStation) openRoute(sheetStation.lat, sheetStation.lng); return; }
    if (act === 'photo'){ if (sheetStation) openPhotoSourceChooser(sheetStation.id); return; }
    if (act === 'fav'){
      if (!sheetStation) return;
      toggleFav(sheetStation.id); renderSheet();
      if (favOnly) renderMarkers();
      return;
    }
    if (act === 'share'){ shareProject(); return; }
    if (act === 'issue'){ if (sheetStation) reportStationIssue(sheetStation.id); return; }
    if (act === 'edit-station'){ if (sheetStation) openEditStationDialog(sheetStation); return; }

  function applyMarkerOpacity(){
    var z = map.getZoom();
    if (z < 13){
      Object.keys(markers).forEach(function(sid){ if (markers[sid]) markers[sid].setOpacity(1); });
      return;
    }
    var now = Date.now() / 1000;
    stationsData.forEach(function(s){
      var m = markers[s.id];
      if (!m) return;
      var maxTs = 0;
      for (var k in s.fuels){ var t = s.fuels[k].ts || 0; if (t > maxTs) maxTs = t; }
      if (!maxTs){ m.setOpacity(0.25); return; }
      var diffHr = (now - maxTs) / 3600;
      var op = 1;
      if (diffHr >= 24) op = 0.2;
      else if (diffHr >= 8) op = 0.45;
      else if (diffHr >= 2) op = 0.75;
      m.setOpacity(op);
    });
  }

  function getFreshInfo(s){
    var now = Date.now() / 1000;
    var count = 0, freshestTs = 0, freshestStatus = null;
    for (var k in s.fuels){
      var f = s.fuels[k];
      if (f && f.status && f.status !== 'unknown' && f.ts && (now - f.ts) < 1800){
        count++;
        if (f.ts > freshestTs){ freshestTs = f.ts; freshestStatus = f.status; }
      }
    }
    if (!count) return { count: 0, color: '#8A8F98' };
    var c = freshestStatus === 'ok' ? '#30D158' : (freshestStatus === 'none' ? '#FF453A' : '#FFB000');
    return { count: count, color: c };
  }

    m.setIcon(makeIcon(STATUS_COLOR[st], getFreshInfo(s)));

  function renderMarkers(){
    Object.keys(markers).forEach(function(k){ map.removeLayer(markers[k]); });
    markers = {};
    var q = searchQuery.trim().toLowerCase();
    var reported = 0;

    stationsData.forEach(function(s){
      var st = statusFor(s.fuels, activeFuel);
      if (st !== 'unknown') reported++;
      if (activeNet !== 'all' && s.net !== activeNet) return;
      if (favOnly && !isFav(s.id)) return;
      if (q && (s.addr + ' ' + s.name).toLowerCase().indexOf(q) === -1) return;

      var m = L.marker([s.lat, s.lng], { icon: makeIcon(STATUS_COLOR[st], getFreshInfo(s)) }).addTo(map);
      markers[s.id] = m;
      bindMarkerClick(s);
    });

    document.getElementById('stat-total').textContent = stationsData.length;

      stationsData = Array.isArray(data.stations) ? data.stations : [];
      fuelsData = Array.isArray(data.fuels) ? data.fuels : [];
      statusesData = Array.isArray(data.statuses) ? data.statuses : [];
      stationFlagsData = Array.isArray(data.station_flags) ? data.station_flags : [];
      networksData = (data.networks && typeof data.networks === 'object') ? data.networks : {};
      document.getElementById('stat-reports-24h').textContent = data.reports_24h || 0;
      lastGlobalStats = {
        reports_24h: data.reports_24h || 0,
        stations_reported: (data.stations || []).filter(function(s){
          for (var k in s.fuels) {
            if (s.fuels[k].status && s.fuels[k].status !== 'unknown' && !s.fuels[k].stale) return true;
          }
          return false;
        }).length
      };
      fillFilterOptions();
      renderMarkers();
      var pts = stationsData.map(function(s){ return [s.lat, s.lng]; });

      if (!window.__onboarding_done) {

        tryOnboarding();

      // На десктопе без onboarding=1 попап не открываем автоматически
    } catch(e){ toast('Не удалось загрузить данные'); }
    flushOfflineQueue();
  }
  function tryOnboarding() {
    // Только с лендинга (?onboarding=1) и только на мобильных
    if (!/[?&]onboarding=1/.test(location.search)) return;
    var ua = navigator.userAgent || '';
    var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(ua);
    if (!isMobile) return;
    if (!navigator.geolocation) return;
    var isOnboarding = true;
    navigator.geolocation.getCurrentPosition(function(pos){
      var lat = pos.coords.latitude, lng = pos.coords.longitude;
      lastPosition = { lat: lat, lng: lng };
      lastGoodPosition = lastPosition;
      lastGoodTimestamp = pos.timestamp;
      if (isOnboarding) {
        map.setView([lat, lng], 15, { animate: true });
      }
      var near = findNearestStation(lat, lng);
      if (near.station && near.distance <= 5000) {
        setTimeout(function(){ openSheet(near.station, false); }, 500);
        if (isOnboarding) {
          setTimeout(function(){ toast('Тапни «Есть» или «Нет» — это 3 секунды'); }, 1200);
        }
      }
    }, function(){ /* отказ — ничего */ }, { timeout: 6000, maximumAge: 60000 });
  }

  function isRealJump(pos){
    if (!lastGoodPosition) return false;
    var dt = (pos.timestamp - lastGoodTimestamp) / 1000;
    if (dt <= 0) dt = 1;
    var dist = haversine(lastGoodPosition.lat, lastGoodPosition.lng, pos.coords.latitude, pos.coords.longitude);
    var speed = dist / dt;
    return speed > 120;
  }

  function startLocate(){
    if (!navigator.geolocation){ toast('Геолокация не поддерживается'); return; }
    // Watch уже активен — просто возобновляем слежение
    if (watchId !== null){
      locateActive = true;
      followMode = true;
      document.getElementById('btn-locate').classList.add('active');
      if (lastPosition) map.setView([lastPosition.lat, lastPosition.lng], 16, { animate:true });
      return;
    }
    locateActive = true; followMode = true;
    try { localStorage.setItem('azs_locate_on', '1'); } catch(e){}
    document.getElementById('btn-locate').classList.add('active');
    watchId = navigator.geolocation.watchPosition(
      function(pos){
        if (!locateActive) return;
        if (isRealJump(pos)) return;
        var lat = pos.coords.latitude, lng = pos.coords.longitude;
        lastPosition = { lat: lat, lng: lng };
        lastGoodPosition = lastPosition;
        lastGoodTimestamp = pos.timestamp;

        if (!meMarker){
          meMarker = L.marker([lat, lng], {
            icon: L.divIcon({ className:'', html:'<div class="me-marker"></div>', iconSize:[18,18], iconAnchor:[9,9] }),
            interactive:false, zIndexOffset:1000
          }).addTo(map);
        } else meMarker.setLatLng([lat, lng]);

        if (followMode) map.setView([lat, lng], 16, { animate:false });

        var near = findNearestStation(lat, lng);
        if (near.station && near.distance <= PROXIMITY_OPEN_M){
          if (!sheetStation || sheetStation.id !== near.station.id) openSheet(near.station, true);
        }
        if (sheetStation && sheetAutoOpened){
          var dToSheet = haversine(lat, lng, sheetStation.lat, sheetStation.lng);
          if (dToSheet > PROXIMITY_CLOSE_M) closeSheet(true);
        }
      },
      function(){ toast('Не удалось определить местоположение'); stopLocate(); },
      { enableHighAccuracy:true, maximumAge:0, timeout:20000 }
    );
  }

  function stopLocate(){
    // watchId НЕ сбрасываем — оставляем watch активным,
    // чтобы браузер не запрашивал разрешение заново
    locateActive = false; followMode = false;
    try { localStorage.setItem('azs_locate_on', '0'); } catch(e){}
    document.getElementById('btn-locate').classList.remove('active');
    if (meMarker){ map.removeLayer(meMarker); meMarker = null; }
  }

  document.getElementById('btn-locate').addEventListener('click', function(){
    if (locateActive){
      if (!followMode && lastPosition){
        followMode = true;
        map.setView([lastPosition.lat, lastPosition.lng], 16, { animate:true });
        toast('Слежение включено');
      } else { stopLocate(); toast('Слежение выключено'); }
    } else startLocate();
  });

  document.getElementById('btn-route').addEventListener('click', function(){
    if (!stationsData.length){ toast('Данные грузятся'); return; }
    var from = lastPosition || map.getCenter();
    var candidates = stationsData.filter(function(s){ return statusFor(s.fuels, activeFuel) === 'ok'; });
    if (!candidates.length) candidates = stationsData.filter(function(s){ return statusFor(s.fuels, activeFuel) !== 'unknown'; });
    if (!candidates.length){ toast('Нет АЗС с топливом'); return; }
    var best = null, bestD = Infinity;
    candidates.forEach(function(s){
      var d = haversine(from.lat, from.lng, s.lat, s.lng);
      if (d < bestD){ bestD = d; best = s; }
    });
    if (!best){ toast('Не найдено'); return; }
    toast('Ближайшая: ' + best.name + ' — ' + (bestD/1000).toFixed(1) + ' км');

              best.lat.toFixed(6) + ',' + best.lng.toFixed(6) + '&rtt=auto';

  function startPinMode(){
    return new Promise(function(resolve){
      pinResolve = resolve;
      document.getElementById('center-pin').classList.add('show');
      document.getElementById('pin-toolbar').classList.add('show');
    });
  }

  function endPinMode(confirm){
    document.getElementById('center-pin').classList.remove('show');
    document.getElementById('pin-toolbar').classList.remove('show');
    var cb = pinResolve;
    pinResolve = null;
    if (!cb) return;
    if (confirm){
      var c = map.getCenter();
      cb({ lat: c.lat, lng: c.lng });
    } else {
      cb(null);
    }
  }

  document.getElementById('pin-cancel').addEventListener('click', function(){ endPinMode(false); });
  document.getElementById('pin-confirm').addEventListener('click', function(){ endPinMode(true); });

        else toast('Не удалось отправить');
      }).catch(function(){ toast('Ошибка сети'); });

  function computeScore(s, from){
    var distKm = haversine(from.lat, from.lng, s.lat, s.lng) / 1000;
    var now = Date.now() / 1000;
    var bestFreshTs = 0;
    for (var k in s.fuels){ var t = s.fuels[k].ts || 0; if (t > bestFreshTs) bestFreshTs = t; }
    var freshness = 0;
    if (bestFreshTs){
      var hrs = (now - bestFreshTs) / 3600;
      if (hrs < 0.5) freshness = 1.0;
      else if (hrs < 8) freshness = 1.0 - (hrs - 0.5) / 7.5;
      else if (hrs < 24) freshness = -0.3 * (hrs - 8) / 16;
      else freshness = -1.0;
    } else freshness = -1.0;
    var proximity = Math.max(0, 1 - distKm / NEARBY_MAX_KM);
    var st = statusFor(s.fuels, 'all');
    var fuelOk = st === 'ok' ? 1.0 : (st === 'low' ? 0.5 : 0);
    var hasQueue = s.flags && s.flags.flag_queue && s.flags.flag_queue.on ? 1 : 0;
    var hasLimit = s.flags && s.flags.flag_limit && s.flags.flag_limit.on ? 1 : 0;
    return 3.0 * freshness + 2.0 * proximity + 2.5 * fuelOk - 1.0 * hasQueue - 0.5 * hasLimit;
  }

  function openNearbySheet(){
    var from = lastPosition;
    if (!from){ toast('Включите геолокацию'); return; }
    var list = document.getElementById('nearby-list');
    list.innerHTML = '';
    var scored = stationsData.map(function(s){
      var d = haversine(from.lat, from.lng, s.lat, s.lng);
      return { s: s, dist: d, score: computeScore(s, from) };
    }).filter(function(x){
      if (x.dist > NEARBY_MAX_KM * 1000) return false;
      if (statusFor(x.s.fuels, 'all') === 'none') return false;
      return true;
    }).sort(function(a, b){ return b.score - a.score; }).slice(0, 12);

    if (!scored.length){
      list.innerHTML = '<div class="nearby-empty">Нет станций в радиусе ' + NEARBY_MAX_KM + ' км.</div>';
    } else {
      scored.forEach(function(x){
        var s = x.s;
        var st = statusFor(s.fuels, 'all');
        var color = STATUS_COLOR[st] || '#8A8F98';
        var distStr = x.dist < 950 ? Math.round(x.dist) + ' м' : (x.dist / 1000).toFixed(1) + ' км';
        var fu = [];
        for (var fk in s.fuels){ if (s.fuels[fk].status === 'ok' && !s.fuels[fk].stale) fu.push(FUEL_SHORT[fk] || fk); }
        var fuelLine = fu.length ? fu.join(' · ') + ' ✅' : 'нет данных';
        var flags = [];
        if (s.flags && s.flags.flag_queue && s.flags.flag_queue.on) flags.push('🚗');
        if (s.flags && s.flags.flag_limit && s.flags.flag_limit.on) flags.push('⛔');
        var flagStr = flags.length ? ' ' + flags.join(' ') : '';
        var item = document.createElement('div');
        item.className = 'nearby-item';
        item.innerHTML = '<span class="ni-dot" style="background:'+color+'"></span>' +
          '<div class="ni-main"><div class="ni-name">'+escapeHtml(s.name)+'</div>' +
          '<div class="ni-meta">'+escapeHtml(s.addr)+' · '+escapeHtml(fuelLine)+flagStr+'</div></div>' +
          '<div class="ni-dist">'+distStr+'</div>';
        item.addEventListener('click', function(){
          closeNearbySheet();
          map.setView([s.lat, s.lng], 16, { animate:true });
          setTimeout(function(){ openSheet(s, false); }, 400);
        });
        list.appendChild(item);
      });
    }
    document.getElementById('nearby-sheet').classList.add('show');
  }

// Deep-link из бота: ?pin=lat,lng — открыть диалог добавления АЗС
(function(){
  try {
    var p = new URLSearchParams(location.search);
    var pin = p.get('pin');
    if (!pin) return;
    var parts = pin.split(',');
    if (parts.length !== 2) return;
    var plat = parseFloat(parts[0]);
    var plng = parseFloat(parts[1]);
    if (!isFinite(plat) || !isFinite(plng)) return;
    if (plat < -90 || plat > 90 || plng < -180 || plng > 180) return;
    setTimeout(function(){
      map.setView([plat, plng], 17, { animate: false });
      if (typeof openAddStationDialog === 'function') {
        openAddStationDialog(plat, plng);
      }
    }, 900);
  } catch(e){}
})();

    if (document.hidden) { flushBatch(true); flushOfflineQueue(); }

      loadStations(); flushOfflineQueue();

  });

  (function(){
    var ONBOARD_KEY = 'azs_onboard_v1';
    try { if (localStorage.getItem(ONBOARD_KEY) === '1') return; } catch(e){ return; }
    var slides = [
      { art: '🚗', title: 'Привет!', text: 'Карта наличия топлива на АЗС СПб и ЛО. Отметки ставят сами водители — как ты.' },
      { art: '📡', title: 'Включи GPS', text: 'Кнопка со спутником в левой колонке. Подсветится жёлтым — слежение включено.' },
      { art: '⛽', title: 'Проезжаешь мимо АЗС', text: 'Попап открывается сам. Отметь что видишь: Есть или Нет по каждому топливу.' },
      { art: '🎯', title: 'Перед выездом', text: '«Что рядом» — 12 ближайших АЗС с топливом. «Маршрут» построит путь.' },
      { art: '🏆', title: 'За отчёты — баллы', text: 'Новые АЗС +50, исправления +20, разведка +5. Звания и топ недели — в боте.' }
    ];
    var idx = 0;
    var el = document.getElementById('onboard');
    var artEl = document.getElementById('ob-art');
    var titleEl = document.getElementById('ob-title');
    var textEl = document.getElementById('ob-text');
    var dotsEl = document.getElementById('ob-dots');
    var nextBtn = document.getElementById('ob-next');
    var skipBtn = document.getElementById('ob-skip');
    var dotHtml = '';
    for (var i = 0; i < slides.length; i++) dotHtml += '<div class="ob-dot"></div>';
    dotsEl.innerHTML = dotHtml;
    var dotEls = dotsEl.querySelectorAll('.ob-dot');
    function render(){
      var s = slides[idx];
      artEl.textContent = s.art;
      titleEl.textContent = s.title;
      textEl.textContent = s.text;
      for (var i = 0; i < dotEls.length; i++) dotEls[i].classList.toggle('on', i === idx);
      nextBtn.textContent = (idx === slides.length - 1) ? 'Понятно' : 'Дальше';
    }
    function close(){
      el.classList.remove('show');
      try { localStorage.setItem(ONBOARD_KEY, '1'); } catch(e){}
    }
    nextBtn.addEventListener('click', function(){
      if (idx === slides.length - 1) { close(); return; }
      idx++; render();
    });
    skipBtn.addEventListener('click', close);
    setTimeout(function(){
      if (sheetStation) return;
      el.classList.add('show');
      render();
    }, 1500);
  })();

})();
