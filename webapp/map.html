<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14171A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>ГДЕ БЕНЗИН!? — Карта АЗС</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/leaflet.css">
<style>
  html, body {
    position: fixed; inset: 0; width: 100%; height: 100%;
    margin: 0; padding: 0; overflow: hidden;
    background: #14171A; color: #E8E6E1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    touch-action: none;
  }
  #map { position: absolute; top: 0; left: 0; right: 0; bottom: 92px; background: #14171A; }
  .leaflet-container { background: #14171A; touch-action: none; }

  #top {
    position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
    padding: 8px 8px 0; pointer-events: none;
    display: flex; flex-direction: column; gap: 6px;
  }
  #top > * { pointer-events: auto; }
  .row { display: flex; gap: 6px; align-items: stretch; }
  .ctrl, .search {
    background: #1A1D21; border: 1px solid #262B31; color: #E8E6E1;
    border-radius: 10px; font-size: 13px; font-weight: 600;
    padding: 9px 10px; height: 40px; box-sizing: border-box;
    appearance: none; -webkit-appearance: none;
  }
  .ctrl {
    flex: 0 0 auto; max-width: 130px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%238A8F98' stroke-width='2' fill='none'/></svg>");
    background-repeat: no-repeat; background-position: right 8px center;
    padding-right: 24px;
  }
  .search {
    flex: 1 1 auto; min-width: 0; padding-left: 30px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238A8F98' stroke-width='2'><circle cx='11' cy='11' r='7'/><path d='M21 21l-4.3-4.3'/></svg>");
    background-repeat: no-repeat; background-position: 10px center;
    outline: none;
  }
  .icon-btn {
    flex: 0 0 auto; width: 40px; height: 40px;
    border-radius: 10px; background: #1A1D21; border: 1px solid #262B31;
    color: #FFB000; display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 18px; line-height: 1; padding: 0; font-family: inherit;
  }
  .icon-btn.active { background: #FFB000; color: #14171A; border-color: #FFB000; }

  #side-tools {
    position: absolute; right: 10px; bottom: 108px; z-index: 1000;
    display: flex; flex-direction: column; gap: 8px; pointer-events: auto;
  }
  .tool-btn {
    width: 60px; height: 60px; border-radius: 14px;
    background: #1A1D21; border: 1px solid #262B31; color: #E8E6E1;
    cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(0,0,0,.45);
    font-size: 26px; font-weight: 700; line-height: 1; font-family: inherit;
  }
  .tool-btn:active { transform: scale(0.96); }
  .tool-btn.active { background: #FFB000; color: #14171A; border-color: #FFB000; }
  .tool-btn svg { width: 26px; height: 26px; display: block; }

  #bottom {
    position: absolute; bottom: 0; left: 0; right: 0; min-height: 92px;
    background: #1A1D21; border-top: 1px solid #262B31; z-index: 1000;
    padding: 6px 10px calc(6px + env(safe-area-inset-bottom, 0));
    display: flex; flex-direction: column; gap: 6px;
  }
  .bottom-row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .stat { font-size: 12px; color: #B7BBC1; cursor: pointer; user-select: none; white-space: nowrap; }
  .stat b { color: #FFB000; font-size: 14px; font-weight: 700; margin-left: 2px; }
  .pill-btn {
    padding: 8px 12px; border-radius: 10px;
    background: #1E2227; border: 1px solid #2B3036; color: #E8E6E1;
    font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit;
    white-space: nowrap;
  }
  .pill-btn.primary { background: #FFB000; color: #14171A; border-color: #FFB000; font-weight: 700; }

  /* ---------- POPUP: КНОПКИ ФИКСИРОВАНЫ ВНИЗУ ---------- */
  .leaflet-popup-content-wrapper {
    background: #1A1D21; color: #E8E6E1;
    border-radius: 14px; box-shadow: 0 8px 32px rgba(0,0,0,.65);
    border: 1px solid #262B31;
  }
  .leaflet-popup-content {
    margin: 12px 14px; min-width: 240px; max-width: 320px;
    font-size: 13px;
    max-height: none; overflow: visible;
  }
  .leaflet-popup-tip { background: #1A1D21; border: 1px solid #262B31; }
  .leaflet-container a.leaflet-popup-close-button { color: #8A8F98; font-size: 20px; padding: 8px; }

  .popup-title { font-size: 15px; font-weight: 700; margin-bottom: 2px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .popup-addr { font-size: 12px; color: #8A8F98; margin-bottom: 10px; }
  .fav-star { cursor: pointer; font-size: 20px; line-height: 1; color: #FFB000; flex-shrink: 0; }

  /* Середина попапа — то, что может скроллиться */
  .popup-scroll {
    max-height: 38vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    margin: 0 -14px;
    padding: 0 14px;
  }

  /* Кнопки внизу — всегда видны */
  .popup-actions-fixed {
    margin-top: 10px; padding-top: 10px;
    border-top: 1px solid #262B31;
  }

  .fuel-block { padding: 8px 0; border-top: 1px solid #262B31; }
  .fuel-block:first-child { border-top: none; }
  .fuel-head { display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 6px; font-size: 13px; }
  .fuel-time { font-size: 11px; color: #8A8F98; }
  .fuel-btns { display: flex; gap: 6px; }
  .sbtn { flex: 1; padding: 8px 0; border-radius: 9px; border: 1px solid #2B3036;
    background: #1E2227; color: #B7BBC1; font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: inherit; }
  .sbtn.ok { color: #1B8A4A; border-color: #1B8A4A55; }
  .sbtn.low { color: #C97C00; border-color: #C97C0055; }
  .sbtn.none { color: #C62828; border-color: #C6282855; }
  .sbtn.current { color: #14171A!important; font-weight: 700; }
  .sbtn.current.ok { background: #1B8A4A; }
  .sbtn.current.low { background: #C97C00; }
  .sbtn.current.none { background: #C62828; color: #fff!important; }

  .flags-row { display: flex; gap: 6px; padding-top: 8px; border-top: 1px solid #262B31; margin-top: 4px; }
  .flag-btn { flex: 1; padding: 8px 4px; border-radius: 9px; border: 1px solid #2B3036;
    background: #1E2227; color: #B7BBC1; font-size: 11.5px; font-weight: 600;
    cursor: pointer; font-family: inherit; }
  .flag-btn.on { background: #FFB000; color: #14171A; border-color: #FFB000; }

  .route-btn, .photo-btn, .issue-btn {
    width: 100%; padding: 10px 0; border-radius: 9px;
    border: 1px solid #2B3036; background: #1E2227; color: #E8E6E1;
    font-size: 12.5px; font-weight: 700; cursor: pointer; font-family: inherit;
    margin-top: 6px;
  }
  .route-btn { margin-top: 0; }
  .photo-btn { background: #FFB000; color: #14171A; border-color: #FFB000; }
  .issue-btn { background: transparent; color: #8A8F98; font-size: 12px; font-weight: 600; }

  .photo-block { margin-top: 10px; padding-top: 10px; border-top: 1px solid #262B31; }
  .stell-photo {
    width: 100%; max-height: 160px; object-fit: cover;
    border-radius: 10px; display: block; cursor: zoom-in;
    background: #0F1215;
  }
  .photo-meta { font-size: 11px; color: #8A8F98; margin-top: 6px; line-height: 1.3; }
  .photo-meta b { color: #B7BBC1; }

  .photo-lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,.94);
    z-index: 5000; display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .photo-lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  .photo-lightbox .close-x {
    position: absolute; top: 14px; right: 14px;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(0,0,0,.6); color: #fff; border: none;
    font-size: 24px; cursor: pointer;
  }

  /* ---------- КАМЕРА ---------- */
  .photo-capture {
    position: fixed; inset: 0; background: #000;
    z-index: 7000; display: flex; align-items: center; justify-content: center;
  }
  .capture-frame {
    position: relative; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .capture-frame video { width: 100%; height: 100%; object-fit: cover; background: #000; }
  .capture-controls {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 20px;
    padding-bottom: calc(20px + env(safe-area-inset-bottom, 0));
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,0));
  }
  .capture-close, .capture-shoot {
    border-radius: 50%; border: none; cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center;
  }
  .capture-close {
    width: 48px; height: 48px; background: rgba(255,255,255,.2); color: #fff;
    font-size: 26px; line-height: 1;
  }
  .capture-shoot {
    width: 78px; height: 78px;
    background: #FFB000; color: #14171A;
    font-size: 15px; font-weight: 700;
    box-shadow: 0 4px 16px rgba(255,176,0,.5);
  }
  .capture-hint {
    position: absolute; top: 16px; left: 0; right: 0;
    text-align: center; color: #fff; font-size: 13px;
    text-shadow: 0 1px 4px rgba(0,0,0,.7); padding: 0 16px;
    pointer-events: none;
  }

  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    z-index: 4000; display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .modal {
    background: #1A1D21; border: 1px solid #262B31; border-radius: 16px;
    padding: 18px; max-width: 380px; width: 100%; color: #E8E6E1;
    max-height: 88vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .modal h3 { margin: 0 0 8px; font-size: 17px; }
  .modal p { margin: 6px 0; font-size: 13px; color: #B7BBC1; line-height: 1.5; }
  .modal-btns { display: flex; gap: 8px; margin-top: 16px; }
  .modal-btns button {
    flex: 1; padding: 11px 0; border-radius: 10px;
    font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .modal-primary { background: #FFB000; color: #14171A; border: none; }
  .modal-secondary { background: #1E2227; color: #E8E6E1; border: 1px solid #2B3036; }
  .brand-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .brand-btn {
    padding: 12px 8px; border-radius: 10px; border: 1px solid #2B3036;
    background: #1E2227; color: #E8E6E1; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit; text-align: center;
  }
  .brand-btn.selected { background: #FFB000; color: #14171A; border-color: #FFB000; }
  .fuel-line { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .fuel-line label { font-size: 13px; width: 55px; color: #B7BBC1; }
  .fuel-line .btns { display: flex; gap: 6px; flex: 1; }
  .fuel-line button {
    flex: 1; padding: 8px 0; border-radius: 8px;
    border: 1px solid #2B3036; background: #1E2227;
    color: #B7BBC1; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .fuel-line button.ok.selected { background: #1B8A4A; color: #fff; border-color: #1B8A4A; }
  .fuel-line button.low.selected { background: #C97C00; color: #fff; border-color: #C97C00; }
  .fuel-line button.none.selected { background: #C62828; color: #fff; border-color: #C62828; }

  .toast {
    position: fixed; left: 50%; bottom: 106px; transform: translateX(-50%);
    background: #232830; color: #E8E6E1;
    border: 1px solid #3A3F45; border-radius: 10px;
    padding: 10px 16px; font-size: 13px;
    z-index: 8000; opacity: 0; transition: opacity .25s;
    pointer-events: none; max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; }

  .me-marker {
    width: 18px; height: 18px; border-radius: 50%;
    background: #1E88E5; border: 3px solid #ffffff;
    box-shadow: 0 0 0 2px rgba(30,136,229,.35), 0 0 12px rgba(30,136,229,.8);
    box-sizing: border-box;
  }

  @media (orientation: landscape) and (max-height: 500px) {
    #top { padding: 6px 8px 0; gap: 4px; }
    .ctrl, .search, .icon-btn { height: 34px; font-size: 12px; padding-top: 6px; padding-bottom: 6px; }
    #side-tools { bottom: 96px; }
    .tool-btn { width: 52px; height: 52px; font-size: 22px; border-radius: 12px; }
    .tool-btn svg { width: 22px; height: 22px; }
    #map { bottom: 84px; }
    #bottom { min-height: 84px; }
    .popup-scroll { max-height: 30vh; }
  }
</style>
</head>
<body>

<div id="map"></div>

<div id="top">
  <div class="row">
    <select id="net-select" class="ctrl"><option value="all">Все сети</option></select>
    <select id="fuel-select" class="ctrl"><option value="all">Топливо</option></select>
    <input id="search-input" class="search" type="search" placeholder="Поиск…" autocomplete="off">
    <button id="fav-toggle" class="icon-btn" title="Избранное">★</button>
    <button id="install-btn" class="icon-btn" title="Установить" style="display:none;">⤓</button>
  </div>
</div>

<div id="side-tools">
  <button class="tool-btn" id="btn-locate" title="Моё местоположение">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M12 2 L19 22 L12 17 L5 22 Z" fill="currentColor" stroke="currentColor"/>
    </svg>
  </button>
  <button class="tool-btn" id="btn-route" title="Маршрут до АЗС с топливом">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 22V6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16"/>
      <path d="M4 12h10"/>
      <path d="M14 10l3 3v6a2 2 0 0 0 4 0v-8l-3-3"/>
    </svg>
  </button>
  <button class="tool-btn" id="btn-zoom-in" title="Приблизить">+</button>
  <button class="tool-btn" id="btn-zoom-out" title="Отдалить">−</button>
</div>

<div id="bottom">
  <div class="bottom-row">
    <div class="stat" id="stat-total-item">Станций: <b id="stat-total">0</b></div>
    <div class="stat" id="stat-reported-item">С отчётом: <b id="stat-reported">0</b></div>
    <div class="stat" id="stat-reports-24h-item">За 24ч: <b id="stat-reports-24h">0</b></div>
  </div>
  <div class="bottom-row">
    <button class="pill-btn" id="support-btn">☕ Поддержать</button>
    <button class="pill-btn primary" id="add-station-btn">+ Добавить АЗС</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="/leaflet.js"></script>
<script>
(function(){
  'use strict';

  var STATUS_COLOR = { ok:'#1B8A4A', low:'#C97C00', none:'#C62828', unknown:'#8A8F98' };
  var STATUS_LABEL = { ok:'Есть', low:'Мало', none:'Нет' };
  var SEVERITY = { ok:0, low:1, none:2 };
  var FLAG_SHORT = { flag_queue:'🚗 Очередь', flag_limit:'⛔ Лимит' };
  var BOT_USERNAME = 'naidibenzin_bot';
  var SUPPORT_TEXT = 'Перевод по номеру счёта в приложении банка (Т-Банк / любой банк — по реквизитам).';
  var SUPPORT_REQ = 'Получатель: Синтетика В.\nСчёт: 40817810000000000000\nТ-Банк';
  var ADMIN_ID = 2145359728;
  var PROXIMITY_OPEN_M = 200;
  var PROXIMITY_CLOSE_M = 250;
  var PROXIMITY_IDLE_MS = 5000;

  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }

  var user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
  var userId = user ? user.id : 0;
  var username = user ? (user.username || user.first_name || '') : '';

  var stationsData = [];
  var fuelsData = [];
  var statusesData = [];
  var stationFlagsData = [];
  var networksData = {};
  var markers = {};
  var activeFuel = 'all';
  var activeNet = 'all';
  var favOnly = false;
  var searchQuery = '';

  var meMarker = null;
  var watchId = null;
  var locateActive = false;
  var lastPosition = null;

  var autoPopupStationId = null;
  var autoPopupIdleTimer = null;

  function favKey(){ return 'azs_favs'; }
  function getFavs(){ try { return JSON.parse(localStorage.getItem(favKey()) || '[]'); } catch(e){ return []; } }
  function isFav(id){ return getFavs().indexOf(id) !== -1; }
  function toggleFav(id){
    var f = getFavs(), i = f.indexOf(id);
    if (i === -1) f.push(id); else f.splice(i,1);
    try { localStorage.setItem(favKey(), JSON.stringify(f)); } catch(e){}
  }

  var map = L.map('map', { zoomControl:false, tap:true }).setView([59.94, 30.31], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap', subdomains:'abc', maxZoom:19
  }).addTo(map);

  function statusFor(fuels, fuelKey){
    if (fuelKey !== 'all'){
      var f = fuels[fuelKey];
      return (f && f.status !== 'unknown' && !f.stale) ? f.status : 'unknown';
    }
    var worst = -1, any = false;
    for (var k in fuels){
      var x = fuels[k];
      if (x.status !== 'unknown' && !x.stale){ any = true; worst = Math.max(worst, SEVERITY[x.status]); }
    }
    if (!any) return 'unknown';
    return worst === 0 ? 'ok' : worst === 1 ? 'low' : 'none';
  }

  function makeIcon(color){
    return L.divIcon({
      className:'',
      html:'<div style="width:16px;height:16px;border-radius:50%;background:'+color+
           ';border:2px solid #14171A;box-shadow:0 0 4px rgba(0,0,0,.5)"></div>',
      iconSize:[16,16], iconAnchor:[8,8]
    });
  }

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c];
    });
  }

  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(function(){ el.classList.remove('show'); }, 2400);
  }

  function haversine(lat1, lon1, lat2, lon2){
    var R = 6371000;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  function findNearestStation(lat, lng){
    var best = null, bestD = Infinity;
    stationsData.forEach(function(s){
      var d = haversine(lat, lng, s.lat, s.lng);
      if (d < bestD){ bestD = d; best = s; }
    });
    return { station: best, distance: bestD };
  }

  function popupHtml(s){
    if (!fuelsData.length || !statusesData.length){
      return '<div style="padding:20px;text-align:center;color:#8A8F98">Загрузка…</div>';
    }

    var scrollContent = '';

    fuelsData.forEach(function(pair){
      var key = pair[0], label = pair[1];
      var f = (s.fuels && s.fuels[key]) || {status:'unknown',ago:null,stale:false,confidence:null};
      var known = f.status !== 'unknown' && !f.stale;
      var timeText = f.status !== 'unknown' ? (f.stale ? 'устарело' : (f.ago || 'только что')) : 'нет данных';
      var confText = (known && f.confidence != null) ? (' · ' + f.confidence + '%') : '';
      var btns = '';
      statusesData.forEach(function(sp){
        var stKey = sp[0], stLabel = sp[1];
        var short = STATUS_LABEL[stKey] || stLabel;
        var cls = 'sbtn ' + stKey + (known && f.status === stKey ? ' current' : '');
        btns += '<button class="'+cls+'" data-act="report" data-st="'+escapeHtml(s.id)+
                '" data-fuel="'+escapeHtml(key)+'" data-status="'+escapeHtml(stKey)+'">'+
                escapeHtml(short)+'</button>';
      });
      scrollContent += '<div class="fuel-block">'+
                '<div class="fuel-head"><b>'+escapeHtml(label)+'</b>'+
                  '<span class="fuel-time">'+escapeHtml(timeText)+escapeHtml(confText)+'</span>'+
                '</div>'+
                '<div class="fuel-btns">'+btns+'</div>'+
              '</div>';
    });

    var flagBtns = '';
    (stationFlagsData || []).forEach(function(fp){
      var fkey = fp[0], flabel = fp[1];
      var fl = s.flags ? s.flags[fkey] : null;
      var on = fl && fl.on;
      var short = FLAG_SHORT[fkey] || flabel;

  async function submitReport(stationId, fuel, status, btn){
    var block = btn.parentNode;
    Array.prototype.forEach.call(block.children, function(b){ b.classList.remove('current'); });
    btn.classList.add('current');
    if (tg && tg.HapticFeedback) try { tg.HapticFeedback.notificationOccurred('success'); } catch(e){}
    try {
      var res = await fetch('/api/report', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ station_id: stationId, fuel: fuel, status: status,
                               user_id: userId, username: username })
      });
      var j = await res.json();
      var s = stationsData.find(function(x){ return x.id === stationId; });
      if (s && s.fuels[fuel]) { s.fuels[fuel].status = status; s.fuels[fuel].stale = false; s.fuels[fuel].ago = 'только что'; }
      if (j && j.ok && j.points_earned) toast('+' + j.points_earned + ' баллов');
      else toast('Статус обновлён');
      updateMarkerFor(stationId);
      if (autoPopupStationId === stationId) setTimeout(closeAutoPopup, 700);
    } catch(e){ console.error(e); toast('Не удалось отправить'); }

  async function toggleFlag(stationId, flagKey, btn){
    var s = stationsData.find(function(x){ return x.id === stationId; });
    var currentlyOn = s && s.flags && s.flags[flagKey] && s.flags[flagKey].on;
    var newStatus = currentlyOn ? 'off' : 'on';
    btn.classList.toggle('on', !currentlyOn);
    try {
      await fetch('/api/report', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ station_id: stationId, fuel: flagKey, status: newStatus,
                               user_id: userId, username: username })
      });
      if (s) s.flags[flagKey] = { on: newStatus === 'on', label: s.flags[flagKey].label, ago:'только что' };
      if (tg && tg.HapticFeedback) try { tg.HapticFeedback.notificationOccurred('success'); } catch(e){}
      resetAutoIdle();
    } catch(e){ console.error(e); }
  }

  function openPhotoCapture(stationId){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      openFileInput(stationId);
      return;
    }

    var stream = null;
    var bg = document.createElement('div');
    bg.className = 'photo-capture';
    bg.innerHTML =
      '<div class="capture-frame">' +
        '<video autoplay playsinline muted></video>' +
        '<div class="capture-hint">Наведите камеру на стеллу</div>' +
        '<div class="capture-controls">' +
          '<button class="capture-close" aria-label="Закрыть">×</button>' +
          '<button class="capture-shoot">📸 Снять</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(bg);

    var video = bg.querySelector('video');

    function stopStream(){
      if (stream){
        try { stream.getTracks().forEach(function(t){ t.stop(); }); } catch(e){}
        stream = null;
      }
    }
    function closeCapture(){ stopStream(); bg.remove(); }

    bg.querySelector('.capture-close').addEventListener('click', closeCapture);

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    }).then(function(s){
      stream = s;
      video.srcObject = s;
      try { video.play(); } catch(e){}
    }).catch(function(err){
      console.warn('getUserMedia failed:', err);
      closeCapture();
      toast('Камера недоступна — выберите фото из галереи');
      openFileInput(stationId);
    });

    bg.querySelector('.capture-shoot').addEventListener('click', function(){
      if (!video.videoWidth){ toast('Камера ещё не готова…'); return; }
      var canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(function(blob){
        if (!blob){ toast('Не удалось сделать снимок'); return; }
        stopStream();
        bg.remove();
        var file = new File([blob], 'stell.jpg', { type: 'image/jpeg' });
        uploadPhoto(stationId, file);
      }, 'image/jpeg', 0.85);
    });
  }

  function openFileInput(stationId){
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.setAttribute('capture', 'environment');
    input.addEventListener('change', function(){
      var file = input.files && input.files[0];
      if (!file) return;
      uploadPhoto(stationId, file);
    });
    input.click();

  function renderMarkers(){
    Object.keys(markers).forEach(function(k){ map.removeLayer(markers[k]); });
    markers = {};
    var q = searchQuery.trim().toLowerCase();
    var reported = 0;

    stationsData.forEach(function(s){
      var st = statusFor(s.fuels, activeFuel);
      if (st !== 'unknown') reported++;

      if (activeNet !== 'all' && s.net !== activeNet) return;
      if (favOnly && !isFav(s.id)) return;
      if (q && (s.addr + ' ' + s.name).toLowerCase().indexOf(q) === -1) return;

      var m = L.marker([s.lat, s.lng], { icon: makeIcon(STATUS_COLOR[st]) }).addTo(map);
      m.bindPopup(popupHtml(s), {
        maxWidth: 340, minWidth: 260,
        autoPanPaddingTopLeft: L.point(12, 90),
        autoPanPaddingBottomRight: L.point(80, 120),
        closeButton: true,
        autoClose: true,
        closeOnClick: true
      });

  function startLocate(opts){
    opts = opts || {};
    if (!navigator.geolocation){ toast('Геолокация не поддерживается'); return; }
    if (watchId !== null){
      if (opts.center && lastPosition){
        map.setView([lastPosition.lat, lastPosition.lng], Math.max(map.getZoom(), 15), { animate:true });
      }
      return;
    }
    locateActive = true;
    document.getElementById('btn-locate').classList.add('active');
    watchId = navigator.geolocation.watchPosition(
      function(pos){
        var lat = pos.coords.latitude, lng = pos.coords.longitude;
        lastPosition = { lat: lat, lng: lng };

        if (!meMarker){
          meMarker = L.marker([lat, lng], {
            icon: L.divIcon({ className:'', html:'<div class="me-marker"></div>',
                              iconSize:[18,18], iconAnchor:[9,9] }),
            interactive:false, zIndexOffset:1000
          }).addTo(map);
        } else {
          meMarker.setLatLng([lat, lng]);
        }

        if (opts.centerOnce){
          map.setView([lat, lng], Math.max(map.getZoom(), 15), { animate:true });
          opts.centerOnce = false;
        }

        var near = findNearestStation(lat, lng);
        if (near.station && near.distance <= PROXIMITY_OPEN_M){
          if (autoPopupStationId !== near.station.id) openAutoPopup(near.station);
          else resetAutoIdle();
        } else if (autoPopupStationId && near.distance > PROXIMITY_CLOSE_M){
          closeAutoPopup();
        }
      },
      function(err){
        console.warn('geolocation error', err);
        toast('Не удалось определить местоположение');
        stopLocate();
      },
      { enableHighAccuracy:true, maximumAge:5000, timeout:20000 }
    );
  }

  function stopLocate(){
    if (watchId !== null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
    locateActive = false;
    document.getElementById('btn-locate').classList.remove('active');
    if (meMarker){ map.removeLayer(meMarker); meMarker = null; }
    closeAutoPopup();
  }

  document.getElementById('btn-locate').addEventListener('click', function(){
    if (locateActive){
      if (lastPosition){
        map.setView([lastPosition.lat, lastPosition.lng], Math.max(map.getZoom(), 15), { animate:true });
      } else {
        toast('Ждём координаты…');
      }
    } else {
      startLocate({ centerOnce: true });
    }
  });

  document.getElementById('btn-route').addEventListener('click', function(){
    if (!stationsData.length){ toast('Данные ещё загружаются'); return; }
    var from = lastPosition || map.getCenter();
    var candidates = stationsData.filter(function(s){
      return statusFor(s.fuels, activeFuel) === 'ok';
    });
    if (!candidates.length){
      candidates = stationsData.filter(function(s){
        return statusFor(s.fuels, activeFuel) === 'low';
      });
    }
    if (!candidates.length){ toast('Нет АЗС с топливом по этому фильтру'); return; }
    var best = null, bestD = Infinity;
    candidates.forEach(function(s){
      var d = haversine(from.lat, from.lng, s.lat, s.lng);
      if (d < bestD){ bestD = d; best = s; }
    });
    if (!best){ toast('Не найдено'); return; }
    var distKm = (bestD / 1000).toFixed(1);
    toast('Ближайшая: ' + best.name + ' — ' + distKm + ' км');
    var url = 'https://yandex.ru/maps/?rtext=' +
              from.lat.toFixed(6) + ',' + from.lng.toFixed(6) + '~' +
              best.lat.toFixed(6) + ',' + best.lng.toFixed(6) + '&rtt=auto';
    if (tg && tg.openLink) tg.openLink(url); else window.open(url, '_blank');
  });

      '</div>';
    document.body.appendChild(bg);
    bg.addEventListener('click', function(e){ if (e.target === bg) bg.remove(); });
    document.getElementById('m-close').addEventListener('click', function(){ bg.remove(); });
    document.getElementById('m-copy').addEventListener('click', function(){
      navigator.clipboard.writeText(SUPPORT_REQ).then(function(){ toast('Реквизиты скопированы'); })
        .catch(function(){ toast('Не удалось скопировать'); });
      setTimeout(function(){ bg.remove(); }, 400);
    });
  });

  var deferredInstallPrompt = null;
  var installBtn = document.getElementById('install-btn');
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  var isStandalone = window.matchMedia('(display-mode: standalone)').matches
                    || window.navigator.standalone === true;

  function showInstallButton(){ if (!isStandalone) installBtn.style.display = 'flex'; }

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredInstallPrompt = e;
    showInstallButton();
  });

  if (isIOS && !isStandalone) showInstallButton();

  window.addEventListener('appinstalled', function(){
    installBtn.style.display = 'none';
    deferredInstallPrompt = null;
    toast('Спасибо! Иконка на рабочем столе');
  });

  function showIOSInstructions(){
    var bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML =
      '<div class="modal">'+
        '<h3>📲 Установить на iPhone</h3>'+
        '<p>1. Нажмите <b>Поделиться</b> <span style="color:#FFB000;">⬆</span> внизу Safari.</p>'+
        '<p>2. Выберите <b>«На экран „Домой“»</b>.</p>'+
        '<p>3. Нажмите <b>«Добавить»</b>.</p>'+
        '<div class="modal-btns"><button class="modal-secondary" id="ios-close">Понятно</button></div>'+
      '</div>';
    document.body.appendChild(bg);
    bg.addEventListener('click', function(e){ if (e.target === bg) bg.remove(); });
    document.getElementById('ios-close').addEventListener('click', function(){ bg.remove(); });
  }

  installBtn.addEventListener('click', function(){
    if (isIOS) { showIOSInstructions(); return; }
    if (deferredInstallPrompt){
      deferredInstallPrompt.prompt();
      deferredInstallPrompt.userChoice.then(function(choice){
        if (choice.outcome === 'accepted') toast('Установлено!');
        deferredInstallPrompt = null;
        installBtn.style.display = 'none';
      });
    }
  });

  try { loadStations(); } catch(e){ console.error('init error', e); }

  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) loadStations();
  });

})();
</script>
</body>
</html>
