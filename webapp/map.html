<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14171A">
<title>ГДЕ БЕНЗИН!? — Карта АЗС</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/leaflet.css">
<style>
  html, body { margin:0; padding:0; height:100%; background:#14171A; color:#E8E6E1;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent; overscroll-behavior:none; }
  #map { position:absolute; top:0; left:0; right:0; bottom:64px; background:#14171A; }
  .leaflet-container { background:#14171A; }

  /* ---------- TOP PANEL ---------- */
  #top { position:absolute; top:0; left:0; right:0; z-index:1000; padding:10px 10px 0;
    pointer-events:none; display:flex; flex-direction:column; gap:8px; }
  #top > * { pointer-events:auto; }
  .row { display:flex; gap:8px; }
  .ctrl { flex:1; min-width:0; background:#1A1D21; border:1px solid #262B31; color:#E8E6E1;
    border-radius:12px; padding:11px 12px; font-size:14px; font-weight:600;
    appearance:none; -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%238A8F98' stroke-width='2' fill='none'/></svg>");
    background-repeat:no-repeat; background-position:right 12px center; padding-right:32px; }
  .search { flex:1; min-width:0; background:#1A1D21; border:1px solid #262B31; color:#E8E6E1;
    border-radius:12px; padding:11px 14px 11px 34px; font-size:14px; outline:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%238A8F98' stroke-width='2'><circle cx='11' cy='11' r='7'/><path d='M21 21l-4.3-4.3'/></svg>");
    background-repeat:no-repeat; background-position:12px center; }
  .icon-btn { width:44px; height:44px; flex-shrink:0; border-radius:12px; background:#1A1D21;
    border:1px solid #262B31; color:#FFB000; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:20px; line-height:1; padding:0; font-family:inherit; }
  .icon-btn.active { background:#FFB000; color:#14171A; border-color:#FFB000; }

  #support-row { display:flex; gap:8px; align-items:center; font-size:12px; color:#B7BBC1; }
  #support-row .pill { background:#1A1D21; border:1px solid #262B31; border-radius:10px;
    padding:6px 12px; cursor:pointer; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
  #support-row .pill b { color:#FFB000; font-weight:700; }

  /* ---------- RIGHT SIDE TOOLBAR ---------- */
  #side-tools { position:absolute; right:10px; bottom:78px; z-index:1000;
    display:flex; flex-direction:column; gap:10px; pointer-events:auto; }
  .tool-btn { width:66px; height:66px; border-radius:16px; background:#1A1D21;
    border:1px solid #262B31; color:#E8E6E1; cursor:pointer; padding:0;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 16px rgba(0,0,0,.45); }
  .tool-btn:active { transform:scale(0.96); }
  .tool-btn.active { background:#FFB000; color:#14171A; border-color:#FFB000; }
  .tool-btn svg { width:28px; height:28px; display:block; }
  .tool-btn.zoom { font-size:28px; font-weight:700; line-height:1; font-family:inherit; }

  /* ---------- BOTTOM PANEL ---------- */
  #bottom { position:absolute; bottom:0; left:0; right:0; height:64px; background:#1A1D21;
    border-top:1px solid #262B31; display:flex; align-items:center; justify-content:space-between;
    padding:0 14px; z-index:1000; gap:10px; }
  .stat { font-size:13px; color:#B7BBC1; cursor:pointer; user-select:none; white-space:nowrap; }
  .stat b { color:#FFB000; font-size:17px; font-weight:700; margin-left:2px; }
  #add-station-btn { padding:10px 14px; border-radius:12px; background:#1E2227; border:1px solid #2B3036;
    color:#E8E6E1; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; }

  /* ---------- POPUP ---------- */
  .leaflet-popup-content-wrapper { background:#1A1D21; color:#E8E6E1; border-radius:14px;
    box-shadow:0 8px 32px rgba(0,0,0,.6); border:1px solid #262B31; }
  .leaflet-popup-content { margin:14px 16px; min-width:260px; font-size:13px; }
  .leaflet-popup-tip { background:#1A1D21; border:1px solid #262B31; }
  .leaflet-container a.leaflet-popup-close-button { color:#8A8F98; font-size:20px; padding:8px; }
  .popup-title { font-size:15px; font-weight:700; margin-bottom:2px; display:flex;
    align-items:center; justify-content:space-between; gap:8px; }
  .popup-addr { font-size:12px; color:#8A8F98; margin-bottom:12px; }
  .fav-star { cursor:pointer; font-size:20px; line-height:1; color:#FFB000; flex-shrink:0; }
  .fuel-block { padding:8px 0; border-top:1px solid #262B31; }
  .fuel-head { display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:6px; font-size:13px; }
  .fuel-time { font-size:11px; color:#8A8F98; }
  .fuel-btns { display:flex; gap:6px; }
  .sbtn { flex:1; padding:8px 0; border-radius:9px; border:1px solid #2B3036; background:#1E2227;
    color:#B7BBC1; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; }
  .sbtn.ok { color:#1B8A4A; border-color:#1B8A4A55; }
  .sbtn.low { color:#C97C00; border-color:#C97C0055; }
  .sbtn.none { color:#C62828; border-color:#C6282855; }
  .sbtn.current { background:currentColor; color:#14171A!important; font-weight:700; }
  .sbtn.current.ok { background:#1B8A4A; }
  .sbtn.current.low { background:#C97C00; }
  .sbtn.current.none { background:#C62828; color:#fff!important; }
  .flags-row { display:flex; gap:6px; padding-top:8px; border-top:1px solid #262B31; margin-top:4px; }
  .flag-btn { flex:1; padding:8px 4px; border-radius:9px; border:1px solid #2B3036; background:#1E2227;
    color:#B7BBC1; font-size:11.5px; font-weight:600; cursor:pointer; font-family:inherit; }
  .flag-btn.on { background:#FFB000; color:#14171A; border-color:#FFB000; }
  .popup-actions { margin-top:8px; padding-top:8px; border-top:1px solid #262B31; }
  .route-btn { width:100%; padding:9px 0; border-radius:9px; border:1px solid #2B3036; background:#1E2227;
    color:#E8E6E1; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit; }
  .photo-btn { width:100%; padding:9px 0; border-radius:9px; border:1px solid #2B3036; background:#1E2227;
    color:#E8E6E1; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit; margin-top:6px; }
  .issue-row { margin-top:8px; }
  .issue-btn { width:100%; padding:9px 0; border-radius:9px; border:1px solid #2B3036; background:transparent;
    color:#8A8F98; font-size:12px; cursor:pointer; font-family:inherit; }

  /* ---------- MODAL ---------- */
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:2000;
    display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal { background:#1A1D21; border:1px solid #262B31; border-radius:16px;
    padding:20px; max-width:380px; width:100%; color:#E8E6E1; max-height:90vh; overflow-y:auto; }
  .modal h3 { margin:0 0 8px; font-size:17px; }
  .modal p { margin:6px 0; font-size:13px; color:#B7BBC1; line-height:1.5; }
  .modal-btns { display:flex; gap:8px; margin-top:16px; }
  .modal-btns button { flex:1; padding:11px 0; border-radius:10px; font-size:14px; font-weight:700;
    cursor:pointer; font-family:inherit; }
  .modal-primary { background:#FFB000; color:#14171A; border:none; }
  .modal-secondary { background:#1E2227; color:#E8E6E1; border:1px solid #2B3036; }
  .brand-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .brand-btn { padding:12px 8px; border-radius:10px; border:1px solid #2B3036; background:#1E2227;
    color:#E8E6E1; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; text-align:center; }
  .brand-btn.selected { background:#FFB000; color:#14171A; border-color:#FFB000; }
  .fuel-line { display:flex; align-items:center; gap:8px; margin-top:8px; }
  .fuel-line label { font-size:13px; width:60px; color:#B7BBC1; }
  .fuel-line .btns { display:flex; gap:6px; flex:1; }
  .fuel-line button { flex:1; padding:8px 0; border-radius:8px; border:1px solid #2B3036;
    background:#1E2227; color:#B7BBC1; font-size:12px; cursor:pointer; font-family:inherit; }
  .fuel-line button.ok.selected { background:#1B8A4A; color:#fff; border-color:#1B8A4A; }
  .fuel-line button.low.selected { background:#C97C00; color:#fff; border-color:#C97C00; }
  .fuel-line button.none.selected { background:#C62828; color:#fff; border-color:#C62828; }

  /* ---------- TOAST ---------- */
  .toast { position:fixed; left:50%; bottom:82px; transform:translateX(-50%);
    background:#232830; color:#E8E6E1; border:1px solid #3A3F45; border-radius:10px;
    padding:10px 16px; font-size:13px; z-index:3000; opacity:0; transition:opacity .25s;
    pointer-events:none; max-width:90vw; text-align:center; }
  .toast.show { opacity:1; }

  /* ---------- MY LOCATION MARKER ---------- */
  .me-marker {
    width:20px; height:20px; border-radius:50%;
    background:#1E88E5; border:3px solid #ffffff;
    box-shadow:0 0 0 2px rgba(30,136,229,.35), 0 0 12px rgba(30,136,229,.8);
    box-sizing:border-box;
  }
</style>
</head>
<body>

<div id="map"></div>

<div id="top">
  <div class="row">
    <select id="net-select" class="ctrl"><option value="all">Все сети</option></select>
    <select id="fuel-select" class="ctrl"><option value="all">Любое топливо</option></select>
  </div>
  <div class="row">
    <input id="search-input" class="search" type="search" placeholder="Поиск по адресу или сети…" autocomplete="off">
    <button id="fav-toggle" class="icon-btn" title="Избранное">★</button>
    <button id="install-btn" class="icon-btn" title="Установить на телефон" style="display:none;">⤓</button>
  </div>
  <div id="support-row">
    <div class="pill">Отчётов за 24ч: <b id="stat-reports-24h">0</b></div>
    <div class="pill" id="support-btn">☕ Поддержать</div>
  </div>
</div>

<div id="side-tools">
  <button class="tool-btn" id="btn-locate" title="Моё местоположение">
    <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
      <path d="M12 2 L19 22 L12 17 L5 22 Z"/>
    </svg>
  </button>
  <button class="tool-btn" id="btn-route" title="Маршрут до АЗС с топливом">
    <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round">
      <path d="M3 11l18-8-8 18-2-8-8-2z"/>
    </svg>
  </button>
  <button class="tool-btn zoom" id="btn-zoom-in" title="Приблизить">+</button>
  <button class="tool-btn zoom" id="btn-zoom-out" title="Отдалить">−</button>
</div>

<div id="bottom">
  <div class="stat" id="stat-total-item">Станций: <b id="stat-total">0</b></div>
  <div class="stat" id="stat-reported-item">С отчётом: <b id="stat-reported">0</b></div>
  <button id="add-station-btn">+ Добавить АЗС</button>
</div>

<div id="toast" class="toast"></div>

<script src="/leaflet.js"></script>
<script>
(function(){
  'use strict';

  var STATUS_COLOR = { ok:'#1B8A4A', low:'#C97C00', none:'#C62828', unknown:'#8A8F98' };
  var STATUS_LABEL = { ok:'Есть', low:'Мало', none:'Нет' };
  var SEVERITY = { ok:0, low:1, none:2 };
  var FLAG_SHORT = { flag_queue:'🚗 Очередь', flag_limit:'⛔ Лимит' };
  var BOT_USERNAME = 'naidibenzin_bot';
  var SUPPORT_TEXT = 'Перевод по номеру счёта в приложении банка (Т-Банк / любой банк — по реквизитам).';
  var SUPPORT_REQ = 'Получатель: Синтетика В.\nСчёт: 40817810000000000000\nТ-Банк';
  var ADMIN_ID = 2145359728;
  var PROXIMITY_OPEN_M = 100;
  var PROXIMITY_CLOSE_M = 150;
  var PROXIMITY_IDLE_MS = 4000;

  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }

  var user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
  var userId = user ? user.id : 0;
  var username = user ? (user.username || user.first_name || '') : '';

  var stationsData = [];
  var fuelsData = [];
  var statusesData = [];
  var stationFlagsData = [];
  var networksData = {};
  var markers = {};
  var activeFuel = 'all';
  var activeNet = 'all';
  var favOnly = false;
  var searchQuery = '';

  var meMarker = null;
  var watchId = null;
  var locateActive = false;
  var lastPosition = null;

  var autoPopupStationId = null;
  var autoPopupIdleTimer = null;

  function favKey(){ return 'azs_favs'; }
  function getFavs(){ try { return JSON.parse(localStorage.getItem(favKey()) || '[]'); } catch(e){ return []; } }
  function isFav(id){ return getFavs().indexOf(id) !== -1; }
  function toggleFav(id){
    var f = getFavs(), i = f.indexOf(id);
    if (i === -1) f.push(id); else f.splice(i,1);
    try { localStorage.setItem(favKey(), JSON.stringify(f)); } catch(e){}
  }

  var map = L.map('map', { zoomControl:false }).setView([59.94, 30.31], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap', subdomains:'abc', maxZoom:19
  }).addTo(map);

  function statusFor(fuels, fuelKey){
    if (fuelKey !== 'all'){
      var f = fuels[fuelKey];
      return (f && f.status !== 'unknown' && !f.stale) ? f.status : 'unknown';
    }
    var worst = -1, any = false;
    for (var k in fuels){
      var x = fuels[k];
      if (x.status !== 'unknown' && !x.stale){ any = true; worst = Math.max(worst, SEVERITY[x.status]); }
    }
    if (!any) return 'unknown';
    return worst === 0 ? 'ok' : worst === 1 ? 'low' : 'none';
  }

  function makeIcon(color){
    return L.divIcon({
      className:'',
      html:'<div style="width:16px;height:16px;border-radius:50%;background:'+color+
           ';border:2px solid #14171A;box-shadow:0 0 4px rgba(0,0,0,.5)"></div>',
      iconSize:[16,16], iconAnchor:[8,8]
    });
  }

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c];
    });
  }

  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(function(){ el.classList.remove('show'); }, 2400);
  }

  function haversine(lat1, lon1, lat2, lon2){
    var R = 6371000;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  function findNearestStation(lat, lng){
    var best = null, bestD = Infinity;
    stationsData.forEach(function(s){
      var d = haversine(lat, lng, s.lat, s.lng);
      if (d < bestD){ bestD = d; best = s; }
    });
    return { station: best, distance: bestD };
  }

  function popupHtml(s){
    if (!fuelsData.length || !statusesData.length){
      return '<div style="padding:20px;text-align:center;color:#8A8F98">Загрузка…</div>';
    }
    var rows = '';
    fuelsData.forEach(function(pair){
      var key = pair[0], label = pair[1];
      var f = (s.fuels && s.fuels[key]) || {status:'unknown',ago:null,stale:false,confidence:null};
      var known = f.status !== 'unknown' && !f.stale;
      var timeText = f.status !== 'unknown' ? (f.stale ? 'устарело' : (f.ago || 'только что')) : 'нет данных';
      var confText = (known && f.confidence != null) ? (' · ' + f.confidence + '%') : '';
      var btns = '';
      statusesData.forEach(function(sp){
        var stKey = sp[0], stLabel = sp[1];
        var short = STATUS_LABEL[stKey] || stLabel;
        var cls = 'sbtn ' + stKey + (known && f.status === stKey ? ' current' : '');
        btns += '<button class="'+cls+'" data-act="report" data-st="'+escapeHtml(s.id)+
                '" data-fuel="'+escapeHtml(key)+'" data-status="'+escapeHtml(stKey)+'">'+
                escapeHtml(short)+'</button>';
      });
      rows += '<div class="fuel-block">'+
                '<div class="fuel-head"><b>'+escapeHtml(label)+'</b>'+
                  '<span class="fuel-time">'+escapeHtml(timeText)+escapeHtml(confText)+'</span>'+
                '</div>'+
                '<div class="fuel-btns">'+btns+'</div>'+
              '</div>';
    });

    var flagBtns = '';
    (stationFlagsData || []).forEach(function(fp){
      var fkey = fp[0], flabel = fp[1];
      var fl = s.flags ? s.flags[fkey] : null;
      var on = fl && fl.on;
      var short = FLAG_SHORT[fkey] || flabel;
      flagBtns += '<button class="flag-btn'+(on?' on':'')+'" data-act="flag" data-st="'+
                  escapeHtml(s.id)+'" data-flag="'+escapeHtml(fkey)+'">'+escapeHtml(short)+'</button>';
    });
    if (flagBtns) rows += '<div class="flags-row">'+flagBtns+'</div>';

    var star = isFav(s.id) ? '❤' : '☆';
    rows += '<div class="popup-actions">'+
              '<button class="route-btn" data-act="route" data-lat="'+s.lat+'" data-lng="'+s.lng+'">🧭 Маршрут</button>'+
              '<button class="photo-btn" data-act="photo" data-st="'+escapeHtml(s.id)+'">📷 Добавить фото стеллы</button>'+
            '</div>'+
            '<div class="issue-row">'+
              '<button class="issue-btn" data-act="issue" data-st="'+escapeHtml(s.id)+'">⚠ Сообщить о неточности</button>'+
            '</div>';

    return '<div class="popup-title">'+escapeHtml(s.name)+
             '<span class="fav-star" data-act="fav" data-st="'+escapeHtml(s.id)+'">'+star+'</span>'+
           '</div>'+
           '<div class="popup-addr">'+escapeHtml(s.addr)+'</div>'+
           rows;
  }

  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act');
    if (act === 'report') submitReport(t.getAttribute('data-st'), t.getAttribute('data-fuel'), t.getAttribute('data-status'), t);
    else if (act === 'flag') toggleFlag(t.getAttribute('data-st'), t.getAttribute('data-flag'), t);
    else if (act === 'route') openRoute(parseFloat(t.getAttribute('data-lat')), parseFloat(t.getAttribute('data-lng')));
    else if (act === 'issue') reportStationIssue(t.getAttribute('data-st'));
    else if (act === 'photo') pickAndUploadPhoto(t.getAttribute('data-st'));
    else if (act === 'fav'){
      var id = t.getAttribute('data-st');
      toggleFav(id);
      t.textContent = isFav(id) ? '❤' : '☆';
      if (favOnly) renderMarkers();
    }
  });

  document.addEventListener('input', resetAutoIdle);
  document.addEventListener('touchstart', resetAutoIdle, { passive:true });

  function resetAutoIdle(){
    if (!autoPopupStationId) return;
    if (autoPopupIdleTimer) clearTimeout(autoPopupIdleTimer);
    autoPopupIdleTimer = setTimeout(closeAutoPopup, PROXIMITY_IDLE_MS);
  }

  function openAutoPopup(station){
    if (autoPopupStationId === station.id) return;
    if (autoPopupStationId) closeAutoPopup();
    autoPopupStationId = station.id;
    var m = markers[station.id];
    if (!m) return;
    var targetZoom = Math.max(map.getZoom(), 15);
    map.flyTo([station.lat, station.lng], targetZoom, { duration: 0.6 });
    setTimeout(function(){
      if (autoPopupStationId === station.id && markers[station.id]) {
        markers[station.id].openPopup();
      }
    }, 350);
    resetAutoIdle();
  }

  function closeAutoPopup(){
    if (autoPopupIdleTimer) { clearTimeout(autoPopupIdleTimer); autoPopupIdleTimer = null; }
    if (autoPopupStationId){
      var m = markers[autoPopupStationId];
      if (m && m.isPopupOpen()) m.closePopup();
      autoPopupStationId = null;
    }
  }

  async function submitReport(stationId, fuel, status, btn){
    var block = btn.parentNode;
    Array.prototype.forEach.call(block.children, function(b){ b.classList.remove('current'); });
    btn.classList.add('current');
    if (tg && tg.HapticFeedback) try { tg.HapticFeedback.notificationOccurred('success'); } catch(e){}
    try {
      var res = await fetch('/api/report', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ station_id: stationId, fuel: fuel, status: status,
                               user_id: userId, username: username })
      });
      var j = await res.json();
      var s = stationsData.find(function(x){ return x.id === stationId; });
      if (s && s.fuels[fuel]) { s.fuels[fuel].status = status; s.fuels[fuel].stale = false; s.fuels[fuel].ago = 'только что'; }
      if (j && j.ok && j.points_earned) toast('+' + j.points_earned + ' баллов');
      else toast('Статус обновлён');
      updateMarkerFor(stationId);
      if (autoPopupStationId === stationId) {
        setTimeout(closeAutoPopup, 500);
      }
    } catch(e){ console.error(e); toast('Не удалось отправить'); }
  }

  async function toggleFlag(stationId, flagKey, btn){
    var s = stationsData.find(function(x){ return x.id === stationId; });
    var currentlyOn = s && s.flags && s.flags[flagKey] && s.flags[flagKey].on;
    var newStatus = currentlyOn ? 'off' : 'on';
    btn.classList.toggle('on', !currentlyOn);
    try {
      await fetch('/api/report', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ station_id: stationId, fuel: flagKey, status: newStatus,
                               user_id: userId, username: username })
      });
      if (s) s.flags[flagKey] = { on: newStatus === 'on', label: s.flags[flagKey].label, ago:'только что' };
      if (tg && tg.HapticFeedback) try { tg.HapticFeedback.notificationOccurred('success'); } catch(e){}
      resetAutoIdle();
    } catch(e){ console.error(e); }
  }

  function openRoute(lat, lng){
    var url = 'https://yandex.ru/maps/?rtext=~' + lat + ',' + lng + '&rtt=auto';
    if (tg && tg.openLink) tg.openLink(url); else window.open(url, '_blank');
  }

  function openBotDeepLink(payload){
    var url = 'https://t.me/' + BOT_USERNAME + '?start=' + encodeURIComponent(payload);
    if (tg && tg.openTelegramLink) tg.openTelegramLink(url);
    else window.open(url, '_blank');
  }

  function reportStationIssue(id){ openBotDeepLink('err_' + id.replace(/-/g,'_')); }

  function pickAndUploadPhoto(stationId){
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.setAttribute('capture', 'environment');
    input.addEventListener('change', function(){
      var file = input.files && input.files[0];
      if (!file) return;
      uploadPhoto(stationId, file);
    });
    input.click();
  }

  async function uploadPhoto(stationId, file){
    if (file.size > 5 * 1024 * 1024){
      toast('Фото слишком большое (макс. 5 МБ)');
      return;
    }
    toast('Загрузка фото…');
    try {
      var fd = new FormData();
      fd.append('station_id', stationId);
      fd.append('user_id', String(userId));
      fd.append('username', username || '');
      fd.append('photo', file, 'photo.jpg');
      var res = await fetch('/api/upload-photo', { method:'POST', body: fd });
      var j = await res.json();
      if (j && j.ok){
        toast('Фото добавлено');
        var s = stationsData.find(function(x){ return x.id === stationId; });
        if (s && markers[stationId]) {
          markers[stationId].setPopupContent(popupHtml(s));
        }
      } else {
        toast('Не удалось загрузить');
      }
    } catch(e){
      console.error(e);
      toast('Ошибка загрузки');
    }
  }

  function updateMarkerFor(stationId){
    var s = stationsData.find(function(x){ return x.id === stationId; });
    var m = markers[stationId];
    if (!s || !m) return;
    var st = statusFor(s.fuels, activeFuel);
    m.setIcon(makeIcon(STATUS_COLOR[st]));
    m.setPopupContent(popupHtml(s));
  }

  function renderMarkers(){
    Object.keys(markers).forEach(function(k){ map.removeLayer(markers[k]); });
    markers = {};
    var q = searchQuery.trim().toLowerCase();
    var reported = 0;

    stationsData.forEach(function(s){
      var st = statusFor(s.fuels, activeFuel);
      if (st !== 'unknown') reported++;

      if (activeNet !== 'all' && s.net !== activeNet) return;
      if (favOnly && !isFav(s.id)) return;
      if (q && (s.addr + ' ' + s.name).toLowerCase().indexOf(q) === -1) return;

      var m = L.marker([s.lat, s.lng], { icon: makeIcon(STATUS_COLOR[st]) }).addTo(map);
      m.bindPopup(popupHtml(s), {
        maxWidth: 320, minWidth: 280,
        autoPanPaddingTopLeft: L.point(16, 140),
        autoPanPaddingBottomRight: L.point(90, 90)
      });
      markers[s.id] = m;
    });

    document.getElementById('stat-total').textContent = stationsData.length;
    document.getElementById('stat-reported').textContent = reported;
  }

  function fillFilterOptions(){
    var netSel = document.getElementById('net-select');
    Object.keys(networksData).forEach(function(k){
      var o = document.createElement('option');
      o.value = k; o.textContent = networksData[k].label;
      netSel.appendChild(o);
    });
    var fuelSel = document.getElementById('fuel-select');
    fuelsData.forEach(function(p){
      var o = document.createElement('option');
      o.value = p[0]; o.textContent = p[1];
      fuelSel.appendChild(o);
    });
  }

  async function loadStations(){
    try {
      var res = await fetch('/api/stations');
      var data = await res.json();
      stationsData = data.stations || [];
      fuelsData = data.fuels || [];
      statusesData = data.statuses || [];
      stationFlagsData = data.station_flags || [];
      networksData = data.networks || {};
      document.getElementById('stat-reports-24h').textContent = data.reports_24h || 0;
      fillFilterOptions();
      renderMarkers();
      var pts = stationsData.map(function(s){ return [s.lat, s.lng]; });
      if (pts.length) map.fitBounds(pts, { padding:[30,30] });
    } catch(e){
      console.error('Ошибка загрузки:', e);
      toast('Не удалось загрузить данные');
    }
  }

  document.getElementById('net-select').addEventListener('change', function(e){
    activeNet = e.target.value; renderMarkers();
  });
  document.getElementById('fuel-select').addEventListener('change', function(e){
    activeFuel = e.target.value; renderMarkers();
  });
  document.getElementById('search-input').addEventListener('input', function(e){
    searchQuery = e.target.value; renderMarkers();
  });
  document.getElementById('fav-toggle').addEventListener('click', function(e){
    favOnly = !favOnly;
    e.currentTarget.classList.toggle('active', favOnly);
    renderMarkers();
  });
  document.getElementById('stat-total-item').addEventListener('click', function(){
    document.getElementById('net-select').value = 'all';
    document.getElementById('fuel-select').value = 'all';
    document.getElementById('search-input').value = '';
    activeNet='all'; activeFuel='all'; searchQuery='';
    renderMarkers();
    var pts = stationsData.map(function(s){ return [s.lat, s.lng]; });
    if (pts.length) map.fitBounds(pts, { padding:[30,30] });
  });
  document.getElementById('stat-reported-item').addEventListener('click', function(){
    var pts = stationsData.filter(function(s){ return statusFor(s.fuels, activeFuel) !== 'unknown'; })
                          .map(function(s){ return [s.lat, s.lng]; });
    if (pts.length) map.fitBounds(pts, { padding:[30,30] });
  });

  document.getElementById('btn-zoom-in').addEventListener('click', function(){ map.zoomIn(); });
  document.getElementById('btn-zoom-out').addEventListener('click', function(){ map.zoomOut(); });

  function startLocate(){
    if (!navigator.geolocation){ toast('Геолокация не поддерживается'); return; }
    if (watchId !== null) return;
    locateActive = true;
    document.getElementById('btn-locate').classList.add('active');
    watchId = navigator.geolocation.watchPosition(
      function(pos){
        var lat = pos.coords.latitude, lng = pos.coords.longitude;
        lastPosition = { lat: lat, lng: lng };
        if (!meMarker){
          meMarker = L.marker([lat, lng], {
            icon: L.divIcon({ className:'', html:'<div class="me-marker"></div>',
                              iconSize:[20,20], iconAnchor:[10,10] }),
            interactive:false, zIndexOffset:1000
          }).addTo(map);
        } else {
          meMarker.setLatLng([lat, lng]);
        }
        map.setView([lat, lng], Math.max(map.getZoom(), 14), { animate:true });

        var near = findNearestStation(lat, lng);
        if (near.station && near.distance <= PROXIMITY_OPEN_M){
          if (autoPopupStationId !== near.station.id){
            openAutoPopup(near.station);
          } else {
            resetAutoIdle();
          }
        } else if (autoPopupStationId && near.distance > PROXIMITY_CLOSE_M){
          closeAutoPopup();
        }
      },
      function(err){
        console.warn('geolocation error', err);
        toast('Не удалось определить местоположение');
        stopLocate();
      },
      { enableHighAccuracy:true, maximumAge:3000, timeout:15000 }
    );
  }

  function stopLocate(){
    if (watchId !== null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
    locateActive = false;
    document.getElementById('btn-locate').classList.remove('active');
    if (meMarker){ map.removeLayer(meMarker); meMarker = null; }
    closeAutoPopup();
  }

  document.getElementById('btn-locate').addEventListener('click', function(){
    if (locateActive) stopLocate(); else startLocate();
  });

  document.getElementById('btn-route').addEventListener('click', function(){
    if (!stationsData.length){ toast('Данные ещё загружаются'); return; }
    var from = lastPosition || (meMarker ? meMarker.getLatLng() : map.getCenter());
    var candidates = stationsData.filter(function(s){
      return statusFor(s.fuels, activeFuel) === 'ok';
    });
    if (!candidates.length){
      candidates = stationsData.filter(function(s){
        return statusFor(s.fuels, activeFuel) === 'low';
      });
    }
    if (!candidates.length){ toast('Нет АЗС с топливом по этому фильтру'); return; }
    var best = null, bestD = Infinity;
    candidates.forEach(function(s){
      var d = haversine(from.lat, from.lng, s.lat, s.lng);
      if (d < bestD){ bestD = d; best = s; }
    });
    if (!best){ toast('Не найдено'); return; }
    var distKm = (bestD / 1000).toFixed(1);
    toast('Ближайшая: ' + best.name + ' — ' + distKm + ' км');
    var url = 'https://yandex.ru/maps/?rtext=' +
              from.lat.toFixed(6) + ',' + from.lng.toFixed(6) + '~' +
              best.lat.toFixed(6) + ',' + best.lng.toFixed(6) + '&rtt=auto';
    if (tg && tg.openLink) tg.openLink(url); else window.open(url, '_blank');
  });

  document.getElementById('add-station-btn').addEventListener('click', function(){
    var lat, lng;
    if (lastPosition){ lat = lastPosition.lat; lng = lastPosition.lng; }
    else { var c = map.getCenter(); lat = c.lat; lng = c.lng; }

    if (userId === ADMIN_ID){
      openAddStationDialog(lat, lng);
    } else {
      var payload = 'add_' + Math.round(lat * 1e6) + '_' + Math.round(lng * 1e6);
      openBotDeepLink(payload);
    }
  });

  function openAddStationDialog(lat, lng){
    var brands = [
      { key:'gpn', label:'Газпромнефть' },
      { key:'lukoil', label:'Лукойл' },
      { key:'rosneft', label:'Роснефть' },
      { key:'tatneft', label:'Татнефть' },
      { key:'ptk', label:'ПТК' },
      { key:'kirishi', label:'Киришиавтосервис' },
      { key:'teboil', label:'Teboil' },
      { key:'faeton', label:'Фаэтон' },
      { key:'other', label:'Другое' }
    ];
    var selectedBrand = null;
    var fuelStates = {};

    var bg = document.createElement('div');
    bg.className = 'modal-bg';
    var html = '<div class="modal">'+
      '<h3>➕ Добавить АЗС</h3>'+
      '<p style="font-size:12px;color:#8A8F98;">Координаты: '+lat.toFixed(5)+', '+lng.toFixed(5)+'</p>'+
      '<p style="font-weight:700;margin-top:12px;">1. Бренд</p>'+
      '<div class="brand-grid" id="brand-grid">';
    brands.forEach(function(b){
      html += '<button type="button" class="brand-btn" data-brand="'+b.key+'">'+b.label+'</button>';
    });
    html += '</div>';
    html += '<p style="font-weight:700;margin-top:16px;">2. Топливо (по желанию)</p>';
    fuelsData.forEach(function(p){
      html += '<div class="fuel-line" data-fuel="'+p[0]+'">'+
        '<label>'+p[1]+'</label>'+
        '<div class="btns">'+
          '<button type="button" class="ok" data-status="ok">Есть</button>'+
          '<button type="button" class="low" data-status="low">Мало</button>'+
          '<button type="button" class="none" data-status="none">Нет</button>'+
        '</div>'+
      '</div>';
    });
    html += '<div class="modal-btns">'+
      '<button type="button" class="modal-secondary" id="as-cancel">Отмена</button>'+
      '<button type="button" class="modal-primary" id="as-save">Сохранить</button>'+
      '</div></div>';
    bg.innerHTML = html;
    document.body.appendChild(bg);

    bg.querySelectorAll('.brand-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        bg.querySelectorAll('.brand-btn').forEach(function(b){ b.classList.remove('selected'); });
        btn.classList.add('selected');
        selectedBrand = btn.getAttribute('data-brand');
      });
    });

    bg.querySelectorAll('.fuel-line').forEach(function(line){
      var fuelKey = line.getAttribute('data-fuel');
      line.querySelectorAll('button').forEach(function(btn){
        btn.addEventListener('click', function(){
          var status = btn.getAttribute('data-status');
          line.querySelectorAll('button').forEach(function(b){ b.classList.remove('selected'); });
          btn.classList.add('selected');
          fuelStates[fuelKey] = status;
        });
      });
    });

    bg.addEventListener('click', function(e){ if (e.target === bg) bg.remove(); });
    bg.querySelector('#as-cancel').addEventListener('click', function(){ bg.remove(); });
    bg.querySelector('#as-save').addEventListener('click', function(){
      if (!selectedBrand){ toast('Выберите бренд'); return; }
      var payload = {
        lat: lat, lng: lng,
        net: selectedBrand,
        fuels: fuelStates,
        user_id: userId,
        username: username || ''
      };
      saveNewStation(payload);
      bg.remove();
    });
  }

  async function saveNewStation(payload){
    try {
      var res = await fetch('/api/add-station', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });
      var j = await res.json();
      if (j && j.ok){
        toast('АЗС добавлена: ' + (j.station && j.station.name || ''));
        await loadStations();
      } else {
        toast('Не удалось добавить: ' + (j.error || ''));
      }
    } catch(e){
      console.error(e);
      toast('Ошибка отправки');
    }
  }

  document.getElementById('support-btn').addEventListener('click', function(){
    var bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML =
      '<div class="modal">'+
        '<h3>☕ Поддержать проект</h3>'+
        '<p>'+SUPPORT_TEXT+'</p>'+
        '<p style="color:#E8E6E1;white-space:pre-line;font-size:13px;background:#14171A;padding:10px;border-radius:8px;margin-top:10px">'+escapeHtml(SUPPORT_REQ)+'</p>'+
        '<div class="modal-btns">'+
          '<button class="modal-primary" id="m-copy">Скопировать</button>'+
          '<button class="modal-secondary" id="m-close">Закрыть</button>'+
        '</div>'+
      '</div>';
    document.body.appendChild(bg);
    bg.addEventListener('click', function(e){ if (e.target === bg) bg.remove(); });
    document.getElementById('m-close').addEventListener('click', function(){ bg.remove(); });
    document.getElementById('m-copy').addEventListener('click', function(){
      navigator.clipboard.writeText(SUPPORT_REQ).then(function(){ toast('Реквизиты скопированы'); })
        .catch(function(){ toast('Не удалось скопировать'); });
      setTimeout(function(){ bg.remove(); }, 400);
    });
  });

  var deferredInstallPrompt = null;
  var installBtn = document.getElementById('install-btn');
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  var isStandalone = window.matchMedia('(display-mode: standalone)').matches
                    || window.navigator.standalone === true;

  function showInstallButton(){
    if (isStandalone) return;
    installBtn.style.display = 'flex';
  }

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredInstallPrompt = e;
    showInstallButton();
  });

  if (isIOS && !isStandalone) showInstallButton();

  window.addEventListener('appinstalled', function(){
    installBtn.style.display = 'none';
    deferredInstallPrompt = null;
    toast('Спасибо! Иконка на рабочем столе');
  });

  function showIOSInstructions(){
    var bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML =
      '<div class="modal">'+
        '<h3>📲 Установить на iPhone</h3>'+
        '<p>1. Нажмите <b>Поделиться</b> <span style="color:#FFB000;">⬆</span> внизу Safari.</p>'+
        '<p>2. Выберите <b>«На экран „Домой“»</b>.</p>'+
        '<p>3. Нажмите <b>«Добавить»</b>.</p>'+
        '<div class="modal-btns"><button class="modal-secondary" id="ios-close">Понятно</button></div>'+
      '</div>';
    document.body.appendChild(bg);
    bg.addEventListener('click', function(e){ if (e.target === bg) bg.remove(); });
    document.getElementById('ios-close').addEventListener('click', function(){ bg.remove(); });
  }

  installBtn.addEventListener('click', function(){
    if (isIOS) { showIOSInstructions(); return; }
    if (deferredInstallPrompt){
      deferredInstallPrompt.prompt();
      deferredInstallPrompt.userChoice.then(function(choice){
        if (choice.outcome === 'accepted') toast('Установлено!');
        deferredInstallPrompt = null;
        installBtn.style.display = 'none';
      });
    }
  });

  loadStations();

  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) loadStations();
  });

})();
</script>
</body>
</html>
